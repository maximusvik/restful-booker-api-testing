name: Replace Runner screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-runner-screenshots.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild clean JPEG screenshots
        shell: bash
        run: |
          set -euo pipefail
          for name in runner-summary runner-create-update runner-patch runner-delete; do
            cat screenshots/.fresh/${name}.part* > /tmp/${name}.b64
            base64 -d /tmp/${name}.b64 > screenshots/${name}.jpg
            test "$(head -c 2 screenshots/${name}.jpg | xxd -p)" = "ffd8"
          done

          test "$(stat -c%s screenshots/runner-summary.jpg)" = "10158"
          test "$(stat -c%s screenshots/runner-create-update.jpg)" = "27190"
          test "$(stat -c%s screenshots/runner-patch.jpg)" = "24874"
          test "$(stat -c%s screenshots/runner-delete.jpg)" = "13508"

          echo "3e549e87a95479808582560da4ed6fa8804f61718543ce3338d896322818e179  screenshots/runner-summary.jpg" | sha256sum -c -
          echo "1936135f65f2578c65b7c2c8b03a98c02314b8f49878a3c9c6d90a2225ff4f4d  screenshots/runner-create-update.jpg" | sha256sum -c -
          echo "df94420afd20b58bd18680e7fe0096b02d3ed3c465162995f86d41b7c598a5c5  screenshots/runner-patch.jpg" | sha256sum -c -
          echo "0224db4c91568aa7b09a54c79058c15c63b4479a0d60f570924b29becb5b3d78  screenshots/runner-delete.jpg" | sha256sum -c -

      - name: Commit clean screenshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -rf screenshots/.fresh
          git rm -f .github/workflows/replace-runner-screenshots.yml
          git add screenshots/runner-summary.jpg screenshots/runner-create-update.jpg screenshots/runner-patch.jpg screenshots/runner-delete.jpg
          git commit -m 'Replace Runner screenshots with clean originals'
          git push
