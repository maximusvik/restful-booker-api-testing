name: Convert Runner screenshots to PNG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-screenshots.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Convert WebP screenshots to PNG
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          names = [
              'runner-summary',
              'runner-create-update',
              'runner-patch',
              'runner-delete',
          ]

          for name in names:
              src = Path('screenshots') / f'{name}.webp'
              dst = Path('screenshots') / f'{name}.png'
              with Image.open(src) as im:
                  im.save(dst, 'PNG')
          PY

      - name: Update README image paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          text = text.replace('runner-summary.webp', 'runner-summary.png')
          text = text.replace('runner-create-update.webp', 'runner-create-update.png')
          text = text.replace('runner-patch.webp', 'runner-patch.png')
          text = text.replace('runner-delete.webp', 'runner-delete.png')
          p.write_text(text)
          PY

      - name: Commit PNG screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md screenshots/*.png
          git commit -m 'Convert Runner screenshots to PNG'
          git push
